<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrowserMCP — AI Browser Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 320px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    color: #1e293b;
    padding: 16px;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .logo-icon {
    font-size: 20px;
  }

  .logo-text {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, #0f172a 0%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 10px;
    color: #64748b;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .status-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .status-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding-bottom: 8px;
    border-bottom: 1px dashed #f1f5f9;
  }

  .status-item:last-of-type {
    border-bottom: none;
    padding-bottom: 0;
  }

  .status-label {
    color: #64748b;
    font-weight: 500;
  }

  .status-value {
    font-weight: 600;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .font-mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    color: #334155;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-waiting {
    background-color: #f59e0b;
    box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4);
    animation: pulse-waiting 1.5s infinite;
  }

  .dot-off {
    background-color: #94a3b8;
  }

  .dot-on {
    background-color: #10b981;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
    animation: pulse-on 1.5s infinite;
  }

  @keyframes pulse-waiting {
    0% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
    }
    70% {
      transform: scale(1);
      box-shadow: 0 0 0 6px rgba(245, 158, 11, 0);
    }
    100% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
    }
  }

  @keyframes pulse-on {
    0% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    }
    70% {
      transform: scale(1);
      box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
    }
    100% {
      transform: scale(0.95);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
    }
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    outline: none;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }

  .btn-primary {
    background: #2563eb;
    color: #ffffff;
  }

  .btn-primary:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
  }

  .btn-danger {
    background: #ef4444;
    color: #ffffff;
  }

  .btn-danger:hover {
    background: #dc2626;
    transform: translateY(-1px);
    box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
  }

  .config-details {
    margin-top: 8px;
    border-top: 1px solid #e2e8f0;
    padding-top: 8px;
  }

  .config-details summary {
    font-size: 11px;
    color: #64748b;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    outline: none;
    padding: 4px 0;
  }

  .config-content {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .config-label {
    font-size: 9px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .config-value {
    font-size: 11px;
    color: #334155;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    word-break: break-all;
    transition: all 0.2s ease;
    position: relative;
  }

  .config-value:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
  }

  .config-value::after {
    content: "📋";
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    opacity: 0.4;
  }

  .footer {
    text-align: center;
    font-size: 10px;
    color: #94a3b8;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-container">
    <span class="logo-icon">🌐</span>
    <span class="logo-text">BrowserMCP</span>
  </div>
  <p class="subtitle">AI Browser Control</p>
</div>

<div class="status-card">
  <div class="status-item">
    <span class="status-label">Server Status</span>
    <span class="status-value">
      <span class="status-dot dot-off" id="statusDot"></span>
      <span id="statusText">Stopped</span>
    </span>
  </div>
  <div class="status-item">
    <span class="status-label">WebSocket</span>
    <span class="status-value font-mono" id="wsStatus">—</span>
  </div>
  <div class="status-item">
    <span class="status-label">AI Agent</span>
    <span class="status-value" id="agentStatus">Not Connected</span>
  </div>

  <button class="btn btn-primary" id="startBtn">Start</button>
</div>

<details class="config-details">
  <summary>Configuration</summary>
  <div class="config-content">
    <div class="config-label">Relay Command</div>
    <div class="config-value" id="configText">python3 relay.py</div>
    <div class="config-label">JSON Config (Claude / Cursor)</div>
    <div class="config-value font-mono" id="jsonConfig">{ "mcpServers": { "browser-mcp": { "command": "python3", "args": ["relay.py"] } } }</div>
  </div>
</details>

<div class="footer">
  BrowserMCP · Zero-setup
</div>

<script src="popup.js"></script>
</body>
</html>
