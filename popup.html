<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser MCP X — AI Browser Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    background: #08030f;
  }

  body {
    width: 320px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at top left, #180c24 0%, #08030f 100%);
    color: #e2e8f0;
    padding: 16px;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .logo-svg {
    width: 28px;
    height: 28px;
    filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.4));
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-2px) rotate(2deg); }
  }

  .logo-text {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, #f472b6 0%, #fb7185 50%, #e11d48 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(244, 114, 182, 0.15));
  }

  .subtitle {
    font-size: 10px;
    color: #a78bfa;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .status-card {
    background: rgba(28, 16, 44, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(244, 114, 182, 0.15);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .status-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    padding-bottom: 10px;
    border-bottom: 1px dashed rgba(244, 114, 182, 0.1);
  }

  .status-item:last-of-type {
    border-bottom: none;
    padding-bottom: 0;
  }

  .status-label {
    color: #a291b5;
    font-weight: 500;
  }

  .status-value {
    font-weight: 600;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .font-mono {
    font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    background: rgba(9, 5, 16, 0.5);
    border: 1px solid rgba(244, 114, 182, 0.08);
    padding: 3px 8px;
    border-radius: 6px;
    color: #f472b6;
    max-width: 170px;
    overflow-x: auto;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-waiting {
    background-color: #f59e0b;
    box-shadow: 0 0 10px #f59e0b, 0 0 2px #f59e0b;
    animation: pulse-waiting 2s infinite;
  }

  .dot-off {
    background-color: #5b4a6b;
    box-shadow: 0 0 4px rgba(91, 74, 107, 0.5);
  }

  .dot-on {
    background-color: #10b981;
    box-shadow: 0 0 10px #10b981, 0 0 2px #10b981;
    animation: pulse-on 2s infinite;
  }

  @keyframes pulse-waiting {
    0% {
      transform: scale(0.95);
      opacity: 0.8;
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
    }
    70% {
      transform: scale(1);
      opacity: 1;
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0);
    }
    100% {
      transform: scale(0.95);
      opacity: 0.8;
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
    }
  }

  @keyframes pulse-on {
    0% {
      transform: scale(0.95);
      opacity: 0.8;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    }
    70% {
      transform: scale(1);
      opacity: 1;
      box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
    }
    100% {
      transform: scale(0.95);
      opacity: 0.8;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
    }
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .btn-primary {
    background: linear-gradient(135deg, #f472b6 0%, #fb7185 50%, #e11d48 100%);
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(244, 114, 182, 0.25);
  }

  .btn-primary:hover {
    transform: translateY(-1.5px);
    box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4);
    filter: brightness(1.05);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .name-input {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    background: rgba(9, 5, 16, 0.5);
    border: 1px solid rgba(244, 114, 182, 0.2);
    border-radius: 6px;
    padding: 4px 8px;
    width: 150px;
    text-align: right;
    outline: none;
  }

  .name-input:focus {
    border-color: #f472b6;
  }

  .relay-note {
    font-size: 11.5px;
    line-height: 1.45;
    color: #fcd34d;
    background: rgba(161, 98, 7, 0.15);
    border: 1px solid rgba(252, 211, 77, 0.25);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .relay-note[hidden],
  .btn[hidden] {
    display: none;
  }

  .btn-secondary {
    background: rgba(244, 114, 182, 0.1);
    color: #f9a8d4;
    border: 1.5px solid rgba(244, 114, 182, 0.4);
    margin-top: 8px;
  }

  .btn-secondary:hover {
    background: rgba(244, 114, 182, 0.2);
    color: #ffffff;
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.08);
    color: #f87171;
    border: 1.5px solid rgba(239, 68, 68, 0.4);
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.1);
  }

  .btn-danger:hover {
    background: rgba(239, 68, 68, 0.18);
    border-color: #ef4444;
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.25);
    transform: translateY(-1.5px);
  }

  .btn-danger:active {
    transform: translateY(0);
  }

  .config-details {
    margin-top: 4px;
    border-top: 1px solid rgba(244, 114, 182, 0.1);
    padding-top: 10px;
  }

  .config-details summary {
    font-size: 11px;
    color: #a78bfa;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    outline: none;
    padding: 6px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: color 0.2s;
  }

  .config-details summary:hover {
    color: #f472b6;
  }

  .summary-icon {
    opacity: 0.8;
  }

  .config-content {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: slideDown 0.3s ease-out;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .config-label {
    font-size: 9px;
    font-weight: 700;
    color: #a291b5;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .config-value {
    font-size: 11.5px;
    color: #e9d5ff;
    background: rgba(9, 5, 16, 0.6);
    border: 1px solid rgba(244, 114, 182, 0.12);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    word-break: break-all;
    transition: all 0.2s ease;
    position: relative;
    padding-right: 32px;
  }

  pre.config-value {
    white-space: pre;
    word-break: normal;
    overflow-x: auto;
    font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
    line-height: 1.4;
  }

  .config-value:hover {
    background: rgba(28, 16, 44, 0.7);
    border-color: rgba(244, 114, 182, 0.3);
  }

  .config-value::after {
    content: "📋";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    opacity: 0.5;
    transition: opacity 0.2s;
  }

  .config-value:hover::after {
    opacity: 0.9;
  }

  .footer {
    text-align: center;
    font-size: 10px;
    color: #5b4a6b;
    margin-top: 16px;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-container">
    <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <defs>
        <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#180c24"/>
          <stop offset="100%" stop-color="#08030f"/>
        </linearGradient>
        <linearGradient id="ring-grad-c4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f472b6"/>
          <stop offset="50%" stop-color="#fb7185"/>
          <stop offset="100%" stop-color="#e11d48"/>
        </linearGradient>
        <linearGradient id="glow-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
        </linearGradient>
      </defs>
      <rect width="128" height="128" rx="28" fill="url(#bg-grad-4)"/>
      <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="url(#ring-grad-c4)" stroke-width="2.5" opacity="0.4"/>
      <circle cx="64" cy="64" r="42" fill="none" stroke="url(#ring-grad-c4)" stroke-width="8" stroke-linecap="round" stroke-dasharray="180 50" transform="rotate(-30 64 64)"/>
      <circle cx="64" cy="64" r="30" fill="url(#glow-grad-4)" opacity="0.15" filter="blur(6px)"/>
      <path d="M50,44 L36,64 L50,84" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M78,44 L92,64 L78,84" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="56" y1="78" x2="72" y2="78" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">Browser MCP X</span>
  </div>
  <p class="subtitle">AI Browser Control</p>
</div>

<div class="status-card">
  <div class="status-item">
    <span class="status-label">Browser name</span>
    <input class="name-input" id="browserName" maxlength="60" spellcheck="false" placeholder="e.g. Work">
  </div>
  <div class="status-item">
    <span class="status-label">Server Status</span>
    <span class="status-value">
      <span class="status-dot dot-off" id="statusDot"></span>
      <span id="statusText">Stopped</span>
    </span>
  </div>
  <div class="status-item">
    <span class="status-label">Relay WebSocket</span>
    <span class="status-value font-mono" id="wsStatus">—</span>
  </div>
  <div class="relay-note" id="relayNote" hidden></div>
  <button class="btn btn-primary" id="startBtn">Start</button>
  <button class="btn btn-secondary" id="takeoverBtn" hidden>Use this browser</button>
</div>


<div class="footer">
  Browser MCP X · Make easier with MCP
</div>

<script src="popup.js"></script>
</body>
</html>
